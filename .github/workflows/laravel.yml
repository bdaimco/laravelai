name: Laravel CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Deployment action
        required: true
        type: choice
        options:
          - deploy-production
          - rollback-production
        default: deploy-production
      rollback_sha:
        description: Commit SHA to restore when rolling back
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: laravel-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.2'

jobs:
  test:
    name: Test Laravel application
    runs-on: ubuntu-latest
    outputs:
      has_composer: ${{ steps.detect.outputs.has_composer }}
      has_laravel_app: ${{ steps.detect.outputs.has_laravel_app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect Laravel application
        id: detect
        shell: bash
        run: |
          if [[ -f composer.json ]]; then
            echo "has_composer=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_composer=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -f composer.json && -f artisan && -f .env.example ]]; then
            echo "has_laravel_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_laravel_app=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint committed PHP
        shell: bash
        run: |
          mapfile -d '' php_files < <(find app config database -type f -name '*.php' -print0 2>/dev/null || true)
          if (( ${#php_files[@]} == 0 )); then
            echo 'No PHP files found; skipping PHP lint.'
            exit 0
          fi
          for file in "${php_files[@]}"; do
            php -l "$file"
          done

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, dom, fileinfo, intl, sqlite, pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        if: steps.detect.outputs.has_composer == 'true'
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Validate Composer files
        if: steps.detect.outputs.has_composer == 'true'
        run: composer validate --strict

      - name: Install dependencies
        if: steps.detect.outputs.has_composer == 'true'
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Prepare application
        if: steps.detect.outputs.has_laravel_app == 'true'
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite
          chmod -R 775 storage bootstrap/cache

      - name: Run migrations
        if: steps.detect.outputs.has_laravel_app == 'true'
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Run tests
        if: steps.detect.outputs.has_laravel_app == 'true'
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

  build:
    name: Build release artifact
    needs: test
    if: ${{ needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: intl, zip
          tools: composer:v2

      - name: Install production dependencies
        if: needs.test.outputs.has_composer == 'true'
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Create release archive
        run: |
          mkdir -p release
          tar --exclude=.git --exclude=release --exclude=.env -czf release/laravel-${GITHUB_SHA}.tar.gz .

      - name: Upload release artifact
        uses: actions/upload-artifact@v6
        with:
          name: laravel-${{ github.sha }}
          path: release/laravel-${{ github.sha }}.tar.gz
          retention-days: 14

  deploy-staging:
    name: Deploy to staging from self-hosted runner
    needs: [test, build]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.outputs.has_laravel_app == 'true' }}
    runs-on: self-hosted
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v7
        with:
          name: laravel-${{ github.sha }}

      - name: Deploy release locally on self-hosted runner
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_PATH)) {
            throw 'Missing staging variable: DEPLOY_PATH'
          }

          $deployPath = [IO.Path]::GetFullPath($env:DEPLOY_PATH)
          $releaseSha = $env:GITHUB_SHA
          $releasePath = Join-Path $deployPath "releases/$releaseSha"
          $currentPath = Join-Path $deployPath 'current'
          $sharedEnv = Join-Path $deployPath 'shared/.env'
          $artifact = Join-Path $PWD "laravel-$releaseSha.tar.gz"

          New-Item -ItemType Directory -Force -Path (Join-Path $deployPath 'releases') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $deployPath 'shared') | Out-Null
          if (-not (Test-Path $sharedEnv)) {
            throw "Missing shared environment file: $sharedEnv"
          }
          if (Test-Path $releasePath) {
            Remove-Item -Recurse -Force $releasePath
          }
          New-Item -ItemType Directory -Force -Path $releasePath | Out-Null
          tar -xzf $artifact -C $releasePath
          Copy-Item -Force $sharedEnv (Join-Path $releasePath '.env')

          Push-Location $releasePath
          try {
            php artisan migrate --force
            php artisan optimize
          } finally {
            Pop-Location
          }

          if (Test-Path $currentPath) {
            $currentItem = Get-Item $currentPath -Force
            if ($currentItem.LinkType -eq 'Junction') {
              Remove-Item -Force $currentPath
            } else {
              Remove-Item -Recurse -Force $currentPath
            }
          }
          New-Item -ItemType Junction -Path $currentPath -Target $releasePath | Out-Null
          Get-ChildItem (Join-Path $deployPath 'releases') -Directory |
            Where-Object { $_.Name -ne $releaseSha -and $_.LastWriteTime -lt (Get-Date).AddDays(-14) } |
            Remove-Item -Recurse -Force

  deploy-production:
    name: Deploy to production
    needs: [test, build]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'deploy-production' && needs.test.outputs.has_laravel_app == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v7
        with:
          name: laravel-${{ github.sha }}

      - name: Deploy production release over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo 'Missing production secret: SSH_PRIVATE_KEY'; exit 1; }
          test -n "$SSH_HOST" || { echo 'Missing production secret: SSH_HOST'; exit 1; }
          test -n "$SSH_USER" || { echo 'Missing production secret: SSH_USER'; exit 1; }
          test -n "$DEPLOY_PATH" || { echo 'Missing production variable: DEPLOY_PATH'; exit 1; }
          trap 'rm -f deploy_key' EXIT
          install -m 600 /dev/null deploy_key
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > deploy_key
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 10 -H "$SSH_HOST" >> ~/.ssh/known_hosts
          scp -i deploy_key laravel-${GITHUB_SHA}.tar.gz "$SSH_USER@$SSH_HOST:/tmp/laravel-${GITHUB_SHA}.tar.gz"
          ssh -i deploy_key "$SSH_USER@$SSH_HOST" "DEPLOY_PATH='$DEPLOY_PATH' RELEASE_SHA='${GITHUB_SHA}' bash -s" <<'REMOTE'
          set -euo pipefail
          release="$DEPLOY_PATH/releases/$RELEASE_SHA"
          mkdir -p "$release"
          tar -xzf "/tmp/laravel-$RELEASE_SHA.tar.gz" -C "$release"
          ln -sfn "$DEPLOY_PATH/shared/.env" "$release/.env"
          cd "$release"
          php artisan migrate --force
          php artisan optimize
          ln -sfn "$release" "$DEPLOY_PATH/current"
          rm -f "/tmp/laravel-$RELEASE_SHA.tar.gz"
          REMOTE
          rm -f deploy_key

  rollback-production:
    name: Roll back production
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'rollback-production' && inputs.rollback_sha != '' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Restore previous release
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo 'Missing production secret: SSH_PRIVATE_KEY'; exit 1; }
          test -n "$SSH_HOST" || { echo 'Missing production secret: SSH_HOST'; exit 1; }
          test -n "$SSH_USER" || { echo 'Missing production secret: SSH_USER'; exit 1; }
          test -n "$DEPLOY_PATH" || { echo 'Missing production variable: DEPLOY_PATH'; exit 1; }
          test -n "$ROLLBACK_SHA" || { echo 'Missing rollback input: rollback_sha'; exit 1; }
          trap 'rm -f deploy_key' EXIT
          install -m 600 /dev/null deploy_key
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > deploy_key
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 10 -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i deploy_key "$SSH_USER@$SSH_HOST" "DEPLOY_PATH='$DEPLOY_PATH' ROLLBACK_SHA='$ROLLBACK_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          test -d "$DEPLOY_PATH/releases/$ROLLBACK_SHA"
          ln -sfn "$DEPLOY_PATH/releases/$ROLLBACK_SHA" "$DEPLOY_PATH/current"
          cd "$DEPLOY_PATH/current"
          php artisan optimize:clear
          php artisan optimize
          REMOTE
          rm -f deploy_key
